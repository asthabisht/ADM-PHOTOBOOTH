[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Serve the booth at the site root (so the kiosk just opens https://<site>/ ).
[[redirects]]
  from = "/"
  to = "/adm_photobooth.html"
  status = 200

# Kiosks always load the latest booth page (no stale cached version after an update).
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
